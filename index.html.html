<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Happy Birthday!</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--W:360px;--H:640px;--s:1;--ink:#3b2616;--hand:'Caveat','Segoe Print','Bradley Hand',cursive;
--kraft:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.75' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .3 0 0 0 0 .18 0 0 0 0 .08 0 0 0 .5 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--kraft),radial-gradient(ellipse at 50% 40%,#d9b88b,#b98f5e 85%);font-family:var(--hand);color:var(--ink);user-select:none;-webkit-user-select:none}
.stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;perspective:2400px;padding:0 0 78px}
.book.init,.book.init+*{transition:none!important}
.book{position:relative;width:calc(var(--W)*2);height:var(--H);transform:scale(var(--s)) translateX(calc(var(--W)*-.5));transition:transform 1s cubic-bezier(.5,0,.2,1);transform-style:flat}
body.open .book{transform:none}
.page{position:absolute;top:0;width:var(--W);height:var(--H);container-type:size}
.right{left:var(--W);z-index:1;border-radius:0 8px 8px 0;box-shadow:0 14px 34px rgba(60,35,10,.45)}
.right>.bg{position:absolute;inset:0;width:100%;height:100%;border-radius:0 8px 8px 0;display:block;pointer-events:none}
.left{left:0;z-index:2;opacity:0;pointer-events:none;transition:opacity .15s}
body.open .left{opacity:1;pointer-events:auto;transition:opacity .35s .65s}
.cover{position:absolute;left:var(--W);top:0;width:var(--W);height:var(--H);z-index:5;transform-origin:left center;transform:rotateY(0);transition:transform 1s cubic-bezier(.5,0,.2,1),z-index 0s .5s;cursor:pointer;transform-style:preserve-3d;border:0;padding:0;background:none}
body.open .cover{transform:rotateY(-180deg);z-index:1;cursor:default}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:0 8px 8px 0;overflow:hidden}
.front{box-shadow:0 16px 40px rgba(60,35,10,.5)}
.front img{width:100%;height:100%;object-fit:cover;display:block}
.back{transform:rotateY(180deg);border-radius:8px 0 0 8px;background:var(--kraft),#c9a679;box-shadow:0 14px 34px rgba(60,35,10,.4)}
.tapme{position:absolute;left:50%;bottom:3.5%;transform:translateX(-50%);background:#fff8e6;padding:.1em .7em;border-radius:3px;font:700 clamp(15px,6cqw,26px)/1.3 var(--hand);box-shadow:0 2px 6px rgba(0,0,0,.35);rotate:-3deg;animation:bob 1.8s ease-in-out infinite;white-space:nowrap}
.tapme{font-size:max(15px,calc(var(--W)*.075))}
@keyframes bob{50%{transform:translateX(-50%) translateY(-5px)}}
body.open .tapme{display:none}
.book::after{content:"";position:absolute;left:calc(50% - 22px);top:0;width:44px;height:100%;background:linear-gradient(90deg,transparent,rgba(50,25,5,.28) 50%,transparent);z-index:9;pointer-events:none;opacity:0;transition:opacity .4s .6s}
body.open .book::after{opacity:1}
/* left page */
.scene{position:absolute;left:10%;top:9%;width:80%;aspect-ratio:636/973}
.envelope{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none;filter:drop-shadow(0 4px 6px rgba(40,15,5,.4))}
.letter{position:absolute;left:-.94%;top:5.94%;width:89.2%;z-index:1;transform:none;transition:transform .7s cubic-bezier(.3,.8,.3,1);cursor:pointer;background:none;border:0;padding:0;display:block;filter:drop-shadow(0 3px 5px rgba(40,15,5,.35))}
.letter img{width:100%;display:block;pointer-events:none}
.letter.lifted{z-index:20;filter:drop-shadow(0 14px 22px rgba(30,10,0,.55))}
.tape{position:absolute;width:28%;height:6%;background:rgba(255,226,140,.72);z-index:3;box-shadow:0 1px 2px rgba(0,0,0,.2);pointer-events:none}
.note{position:absolute;left:0;right:0;bottom:3%;text-align:center;font:700 clamp(15px,7cqw,26px)/1.1 var(--hand);color:#5a3a20;pointer-events:none}
/* right page */
.fl{position:absolute;width:5.2%;transform:translate(-50%,-88%);pointer-events:none}
.fl img{width:100%;display:block;transform-origin:50% 100%;will-change:transform}
.fl.out img{opacity:0;transition:opacity .3s}
.puff{position:absolute;width:3%;aspect-ratio:1;border-radius:50%;background:rgba(245,240,230,.75);filter:blur(1.5px);transform:translate(-50%,-50%);animation:puff 1.6s ease-out forwards;pointer-events:none}
@keyframes puff{to{transform:translate(calc(-50% + var(--dx)),-420%) scale(3.2);opacity:0}}
#wish{position:fixed;inset:0;z-index:55;display:flex;align-items:center;justify-content:center;background:rgba(35,18,5,.55);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .4s}
#wish.show{opacity:1;pointer-events:auto}
.wcard{position:relative;max-width:88vw;background:#fff7e3;padding:clamp(22px,5vw,44px) clamp(24px,6vw,64px);text-align:center;box-shadow:0 18px 50px rgba(0,0,0,.55);transform:rotate(-2deg) scale(.3);transition:transform .6s cubic-bezier(.3,1.7,.5,1)}
#wish.show .wcard{transform:rotate(-2deg) scale(1)}
.wcard h2{margin:0 0 .35em;font:700 clamp(40px,10vw,92px)/1 var(--hand);color:#b3201a}
.wcard::before{content:"";position:absolute;left:35%;top:-16px;width:30%;height:30px;background:rgba(255,226,140,.85);box-shadow:0 1px 2px rgba(0,0,0,.25)}
.wcard button{font:700 clamp(22px,4vw,30px) var(--hand);color:var(--ink);background:#fff;border:2px solid var(--ink);border-radius:8px 14px 9px 13px;padding:4px 18px;cursor:pointer;box-shadow:2px 3px 0 rgba(60,35,10,.55)}
/* controls */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:center;padding:10px 12px calc(10px + env(safe-area-inset-bottom));opacity:0;pointer-events:none;transition:opacity .4s}
body.open .bar{opacity:1;pointer-events:auto;transition-delay:.7s}
button.btn{font:700 20px var(--hand);color:var(--ink);background:#fff7e3;border:2px solid var(--ink);border-radius:8px 14px 9px 13px;padding:4px 14px;cursor:pointer;box-shadow:2px 3px 0 rgba(60,35,10,.55);touch-action:manipulation}
button.btn:active,#hold.on{transform:translate(2px,3px);box-shadow:none;background:#ffd98a}
.mic{display:flex;align-items:center;gap:8px;background:rgba(255,247,227,.85);padding:4px 10px;border-radius:8px;font:600 17px var(--hand)}
.meter{width:96px;height:12px;border:2px solid var(--ink);border-radius:7px;background:#fff;position:relative;overflow:hidden}
.meter i{position:absolute;left:0;top:0;bottom:0;width:0;background:#6bb04a}
.meter i.hot{background:#e8541e}
.meter b{position:absolute;top:0;bottom:0;left:25%;width:2px;background:var(--ink)}
canvas#cf{position:fixed;inset:0;width:100%;height:100%;z-index:60;pointer-events:none}
</style></head><body>

<div class="bar" id="bar">
 <button class="btn" id="back">← back to cover</button>
 <div class="mic"><span>🎤</span><div class="meter"><i id="lvl"></i><b></b></div><span id="status">mic off</span><button class="btn" id="micbtn" style="font-size:16px;padding:1px 10px">enable mic</button></div>
 <button class="btn" id="hold">hold to blow 💨</button>

<div id="wish"><div class="wcard"><h2>make a wish, <span id="nm"></span>!</h2><button id="relight">🕯 relight</button></div></div>
<canvas id="cf"></canvas>
<script>
const NAME="Devaj"; // <- name shown in "make a wish, ___"
const $=id=>document.getElementById(id);
$('nm').textContent=NAME;
const body=document.body,book=$('book'),letter=$('letter');
let isOpen=false,lifted=false;
/* ---------- sizing ---------- */
function fit(){
  const vw=innerWidth,vh=innerHeight,availH=vh-150;
  const W=Math.max(120,Math.min((vw-24)/2,availH*9/16,440)),H=W*16/9;
  const s=Math.max(1,Math.min((vw-40)/W,availH/H,2.2));
  const r=document.documentElement.style;
  r.setProperty('--W',W+'px');r.setProperty('--H',H+'px');r.setProperty('--s',s);
  if(lifted)lift(true);
}
addEventListener('resize',fit);fit();requestAnimationFrame(()=>requestAnimationFrame(()=>book.classList.remove('init')));
/* ---------- open / close ---------- */
$('cover').onclick=()=>{ if(isOpen)return; isOpen=true; body.classList.add('open'); startMic(); };
$('back').onclick=()=>{ if(lifted)tuck(); isOpen=false; body.classList.remove('open'); stopMic(); relight(); };
/* ---------- letter ---------- */
let seq=0;const SLIDE='translateX(-32%)';
function lift(re){
  lifted=true;letter.setAttribute('aria-pressed','true');$('note').textContent='tap again to tuck it back';
  const sc=$('scene').getBoundingClientRect(),pg=$('left').getBoundingClientRect();
  const lw=letter.offsetWidth,lh=letter.offsetHeight,vw=innerWidth,vh=innerHeight;
  let tw,cx,cy;
  if(vw<560){tw=Math.min(vw*.92,(vh-150)*lw/lh);cx=vw/2;cy=(vh-70)/2;}
  else{tw=Math.min(pg.width*.88,pg.height*.88*lw/lh);cx=pg.left+pg.width/2;cy=pg.top+pg.height/2;}
  const dx=cx-(sc.left+letter.offsetLeft+lw/2),dy=cy-(sc.top+letter.offsetTop+lh/2);
  const final=`translate(${dx}px,${dy}px) scale(${tw/lw})`, me=++seq;
  if(re===true||letter.classList.contains('lifted')){letter.style.transform=final;return;}
  letter.style.transform=SLIDE;                       // 1) slide left out of the envelope opening (still behind it)
  setTimeout(()=>{if(me!==seq)return;letter.classList.add('lifted');letter.style.transform=final;},700); // 2) come to the front
}
function tuck(){
  lifted=false;letter.setAttribute('aria-pressed','false');$('note').textContent='tap the letter to read ✉';
  const me=++seq;letter.style.transform=SLIDE;       // back over the envelope, still in front
  setTimeout(()=>{if(me!==seq)return;letter.classList.remove('lifted');letter.style.transform='';},700); // then drop in behind it
}
letter.onclick=()=>lifted?tuck():lift();
/* ---------- flames ---------- */
const fls=[...document.querySelectorAll('.fl')];
let lit=true,blowT=0,lv=0,micLevel=0,holding=false,noise=.005;
function extinguish(){
  lit=false;blowT=0;
  fls.forEach((f,i)=>{f.classList.add('out');const p=document.createElement('div');p.className='puff';
    p.style.left=f.style.left;p.style.top=f.style.top;p.style.setProperty('--dx',(18+i*3)+'px');p.style.animationDelay=(i*40)+'ms';$('right').appendChild(p);setTimeout(()=>p.remove(),2000);});
  $('wish').classList.add('show');confetti();
}
function relight(){lit=true;blowT=0;fls.forEach(f=>f.classList.remove('out'));$('wish').classList.remove('show');stopConfetti();}
$('relight').onclick=relight;
/* ---------- mic ---------- */
let ctx,stream,an,buf,micOn=false;
const status=t=>$('status').textContent=t;
async function startMic(){
  if(micOn)return;
  if(!isSecureContext||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){status('mic needs https — use hold to blow');return;}
  try{
    stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    ctx=new (window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')await ctx.resume();
    an=ctx.createAnalyser();an.fftSize=1024;ctx.createMediaStreamSource(stream).connect(an);buf=new Float32Array(an.fftSize);
    micOn=true;status('mic on — blow!');$('micbtn').style.display='none';
  }catch(e){status('mic blocked — use hold to blow');}
}
function stopMic(){micOn=false;micLevel=0;if(stream)stream.getTracks().forEach(t=>t.stop());if(ctx)ctx.close();stream=ctx=null;status('mic off');$('micbtn').style.display='';}
$('micbtn').onclick=startMic;
function readMic(){
  if(!micOn)return 0;
  an.getFloatTimeDomainData(buf);let s=0;for(let i=0;i<buf.length;i++)s+=buf[i]*buf[i];
  const rms=Math.sqrt(s/buf.length);
  if(rms<noise*1.8)noise+=(rms-noise)*.03; // track room noise
  return Math.max(0,Math.min(1,(rms-noise*2-.01)/.12));
}
/* hold-to-blow */
const hold=$('hold');
const hset=v=>{holding=v;hold.classList.toggle('on',v);};
hold.addEventListener('pointerdown',e=>{e.preventDefault();hset(true);});
['pointerup','pointercancel','pointerleave'].forEach(t=>hold.addEventListener(t,()=>hset(false)));
addEventListener('keydown',e=>{if(e.code==='Space'&&isOpen){e.preventDefault();if(!e.repeat)hset(true);}});
addEventListener('keyup',e=>{if(e.code==='Space')hset(false);});
addEventListener('blur',()=>hset(false));
/* ---------- main loop ---------- */
let last=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;const t=now/1000;
  micLevel=readMic();
  const input=Math.max(micLevel,holding?.85:0);
  lv+=(input-lv)*Math.min(1,dt*12);
  const L=$('lvl');L.style.width=(lv*100)+'%';L.classList.toggle('hot',input>.25);
  if(lit&&isOpen){ if(input>.25)blowT+=dt; else blowT=Math.max(0,blowT-dt*1.5); if(blowT>=.5)extinguish(); }
  fls.forEach((f,i)=>{
    const b=lit?lv:1, fl=Math.sin(t*7+i*1.9)*2.2+Math.sin(t*13.3+i*.7)*1.2;
    const ang=lit?fl*(1-lv)+lv*(46+(i%3)*5):70, sk=lit?-lv*16:-25, sy=lit?1-lv*.22+Math.sin(t*9+i)*.04*(1-lv):.3;
    f.firstElementChild.style.transform=`rotate(${ang}deg) skewX(${sk}deg) scaleY(${sy})`;
  });
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
/* ---------- confetti ---------- */
const cv=$('cf'),cx2=cv.getContext('2d');let parts=[],cfRun=false;
function size(){cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio;}size();addEventListener('resize',size);
function confetti(){
  const r={left:0,width:innerWidth,top:0,height:innerHeight},cols=['#e8541e','#f7b731','#c0262d','#3f6fb5','#e88ab0','#4f9d5b','#fff3d0'];
  parts=[];for(let i=0;i<220;i++)parts.push({x:r.left+r.width*(.2+Math.random()*.6),y:r.top+r.height*.5,vx:(Math.random()-.5)*20,vy:-Math.random()*15-4,w:7+Math.random()*8,h:4+Math.random()*6,a:Math.random()*6,va:(Math.random()-.5)*.4,c:cols[i%cols.length],life:0});
  if(!cfRun){cfRun=true;requestAnimationFrame(cfLoop);}
}
function stopConfetti(){parts=[];}
function cfLoop(){
  cx2.setTransform(1,0,0,1,0,0);cx2.clearRect(0,0,cv.width,cv.height);cx2.scale(devicePixelRatio,devicePixelRatio);
  parts.forEach(p=>{p.vy+=.35;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;p.life++;
    cx2.save();cx2.translate(p.x,p.y);cx2.rotate(p.a);cx2.globalAlpha=Math.max(0,1-p.life/200);cx2.fillStyle=p.c;cx2.fillRect(-p.w/2,-p.h/2,p.w,p.h);cx2.restore();});
  parts=parts.filter(p=>p.life<200&&p.y<innerHeight+40);
  if(parts.length)requestAnimationFrame(cfLoop);else{cfRun=false;cx2.setTransform(1,0,0,1,0,0);cx2.clearRect(0,0,cv.width,cv.height);}
}
